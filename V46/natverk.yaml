AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Novatrix network layer (v44 as code). Stack name: novatrix-natverk.
  Skeleton: the parts marked TODO are yours to write, see Del 14B steps 6 to 8.

Parameters:
  Prefix:
    Type: String
    Default: novatrix
    AllowedPattern: "[a-z][a-z0-9-]*"
    Description: Name prefix for all resources, e.g. novatrix
  MyIp:
    Type: String
    AllowedPattern: "(\\d{1,3}\\.){3}\\d{1,3}/32"
    Description: Public address of YOUR computer for SSH, e.g. 203.0.113.10/32

Resources:
  # Step 6: the VPC and the public subnet are done, add the two private subnets
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${Prefix}-vpc

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${Prefix}-public

  # TODO PrivateSubnetA: 10.0.2.0/24 in the first AZ, name ${Prefix}-private-a
  # TODO PrivateSubnetB: 10.0.4.0/24 in the second AZ, name ${Prefix}-private-b

  # Step 7: internet gateway, attachment, route table, route and association
  # TODO InternetGateway (AWS::EC2::InternetGateway), name ${Prefix}-igw
  # TODO GatewayAttachment (AWS::EC2::VPCGatewayAttachment)
  # TODO PublicRouteTable (AWS::EC2::RouteTable), name ${Prefix}-public-rt
  # TODO InternetRoute (AWS::EC2::Route), DependsOn: GatewayAttachment
  # TODO PublicSubnetRoute (AWS::EC2::SubnetRouteTableAssociation)

  # Step 7: the NACL for the public subnet. One rule is done as a pattern.
  PublicNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${Prefix}-public-nacl
  NaclInHttp:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref PublicNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 0.0.0.0/0, PortRange: {From: 80, To: 80}}
  # TODO the other rules from v44 and v45: in 110, 120, 130, out 100, 110, 120, 140, 150
  # TODO PublicSubnetNacl (AWS::EC2::SubnetNetworkAclAssociation)

  # Step 8: security groups. The web group is done.
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${Prefix}-web-sg
      GroupDescription: HTTP and HTTPS from everyone, SSH from my IP
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref MyIp}
  # TODO DbSecurityGroup: ${Prefix}-db-sg, 3306 with SourceSecurityGroupId: !Ref WebSecurityGroup
  # TODO EfsSecurityGroup: ${Prefix}-efs-sg, 2049 with SourceSecurityGroupId: !Ref WebSecurityGroup

# Step 8: Outputs with Export, read by the other stacks with !ImportValue
Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: {Name: !Sub "${Prefix}-vpc-id"}
  PublicSubnetId:
    Value: !Ref PublicSubnet
    Export: {Name: !Sub "${Prefix}-public-subnet-id"}
  WebSecurityGroupId:
    Value: !Ref WebSecurityGroup
    Export: {Name: !Sub "${Prefix}-web-sg-id"}
  # TODO PrivateSubnetAId (${Prefix}-private-a-id), PrivateSubnetBId (${Prefix}-private-b-id)
  # TODO DbSecurityGroupId (${Prefix}-db-sg-id), EfsSecurityGroupId (${Prefix}-efs-sg-id)
