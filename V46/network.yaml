AWSTemplateFormatVersion: '2010-09-09'
Description: Novatrix network infrastructure

Resources:
  # The VPC is our own private network in AWS.
  NovatrixVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: novatrix-vpc

  # Public subnet: can be reached from the internet.
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NovatrixVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: eu-north-1a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: novatrix-public

  # RDS needs a subnet in each of at least two Availability Zones.
  # Private subnet A: not reachable from the internet.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NovatrixVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: eu-north-1a
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: novatrix-private-a

  # Private subnet B: same idea, but in a different zone (b).
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NovatrixVPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: eu-north-1b
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: novatrix-private-b

  # The Internet Gateway is the "door" between our VPC and the internet.
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: novatrix-igw

  # This connects the Internet Gateway to our VPC.
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref NovatrixVPC
      InternetGatewayId: !Ref InternetGateway

  # A route table is a list of rules that say where network traffic goes.
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref NovatrixVPC
      Tags:
        - Key: Name
          Value: novatrix-public-rt

  # This rule sends all internet traffic (0.0.0.0/0) to the Internet Gateway.
  # DependsOn makes sure the gateway is attached to the VPC first.
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # This links the route table to the public subnet.
  # Now the public subnet can really reach the internet.
  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable
