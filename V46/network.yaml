AWSTemplateFormatVersion: '2010-09-09'
Description: Novatrix network infrastructure

Resources:
  # The VPC is our own private network in AWS.
  NovatrixVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: novatrix-vpc

  # Public subnet A.
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NovatrixVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: eu-north-1a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: novatrix-public

  # v47: Second public subnet in Availability Zone B.
  # An Application Load Balancer must span at least two AZs, so one
  # public subnet is not enough anymore. 10.0.3.0/24 does not overlap
  # with the other subnets (.1 = public A, .2 = private A, .4 = private B).
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NovatrixVPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: eu-north-1b
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: novatrix-public-b

  # Private subnet A.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NovatrixVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: eu-north-1a
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: novatrix-private-a

  # Private subnet B.
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NovatrixVPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: eu-north-1b
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: novatrix-private-b

  # Internet Gateway.
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: novatrix-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref NovatrixVPC
      InternetGatewayId: !Ref InternetGateway

  # Public route table.
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref NovatrixVPC
      Tags:
        - Key: Name
          Value: novatrix-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # Connect both public subnets to the same route table.
  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # v47: Without this association PublicSubnetB would use the VPC's main
  # route table and have no route to the internet, even though it is
  # called "public". The ALB node in this subnet would not be reachable.
  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # Private route table.
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref NovatrixVPC
      Tags:
        - Key: Name
          Value: novatrix-private-rt

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # v47: Security group for the Application Load Balancer.
  # The ALB is now the only public entry point for web traffic, so it is
  # the one that accepts HTTP and HTTPS from the whole internet.
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Novatrix ALB
      GroupName: novatrix-alb-sg
      VpcId: !Ref NovatrixVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: novatrix-alb-sg

  # Web server security group.
  # The description is unchanged on purpose: changing GroupDescription
  # forces a replacement, and a group with a custom GroupName cannot be
  # replaced in an existing stack.
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Novatrix web server
      GroupName: novatrix-web-sg
      VpcId: !Ref NovatrixVPC
      Tags:
        - Key: Name
          Value: novatrix-web-sg

  # v47: HTTP traffic is now only allowed from the ALB.
  # Before this the rule used CidrIp 0.0.0.0/0. Referencing the ALB's
  # security group instead means the web server can no longer be reached
  # directly from the internet, only through the load balancer.
  # HTTPS (443) is removed here: the ALB terminates it and talks HTTP
  # to the web server inside the VPC.
  WebInboundHTTP:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WebSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !Ref AlbSecurityGroup

  # SSH only from your IP address.
  WebInboundSSH:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WebSecurityGroup
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: 81.226.253.57/32

  # Public Network ACL.
  PublicNetworkAcl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref NovatrixVPC
      Tags:
        - Key: Name
          Value: novatrix-public-nacl

  # Associate the same NACL with both public subnets.
  PublicNetworkAclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      SubnetId: !Ref PublicSubnet

  # v47: Puts the new subnet behind the same NACL rules as subnet A.
  # Without it the subnet would use the VPC's default NACL, which
  # allows everything and would bypass the rules below.
  PublicSubnetBNaclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      SubnetId: !Ref PublicSubnetB

  # --- Inbound NACL rules ---

  PublicInboundHTTP:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 80
        To: 80

  PublicInboundHTTPS:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 110
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 443
        To: 443

  PublicInboundSSH:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 120
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 81.226.253.57/32
      PortRange:
        From: 22
        To: 22

  PublicInboundEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 130
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 1024
        To: 65535

  # --- Outbound NACL rules ---

  PublicOutboundHTTP:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 80
        To: 80

  PublicOutboundHTTPS:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 110
      Protocol: 6
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 443
        To: 443

  PublicOutboundEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 120
      Protocol: 6
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 1024
        To: 65535

  PublicOutboundMySQL:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 140
      Protocol: 6
      RuleAction: allow
      Egress: true
      CidrBlock: 10.0.0.0/16
      PortRange:
        From: 3306
        To: 3306

  PublicOutboundNFS:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 150
      Protocol: 6
      RuleAction: allow
      Egress: true
      CidrBlock: 10.0.0.0/16
      PortRange:
        From: 2049
        To: 2049

# Outputs share values with other stacks.
Outputs:
  VPCId:
    Description: ID of the Novatrix VPC
    Value: !Ref NovatrixVPC
    Export:
      Name: novatrix-vpc-id

  PublicSubnetId:
    Description: ID of the public subnet
    Value: !Ref PublicSubnet
    Export:
      Name: novatrix-public-subnet-id

  # v47: Second public subnet. The web stack imports this together with
  # PublicSubnetId to place the load balancer in two AZs.
  PublicSubnetBId:
    Description: ID of public subnet B
    Value: !Ref PublicSubnetB
    Export:
      Name: novatrix-public-b-subnet-id

  PrivateSubnetAId:
    Description: ID of private subnet A
    Value: !Ref PrivateSubnetA
    Export:
      Name: novatrix-private-subnet-a-id

  PrivateSubnetBId:
    Description: ID of private subnet B
    Value: !Ref PrivateSubnetB
    Export:
      Name: novatrix-private-subnet-b-id

  WebSecurityGroupId:
    Description: ID of the web server security group
    Value: !Ref WebSecurityGroup
    Export:
      Name: novatrix-web-sg-id

  # v47: ALB security group, imported by the web stack when it creates
  # the load balancer.
  AlbSecurityGroupId:
    Description: ID of the ALB security group
    Value: !Ref AlbSecurityGroup
    Export:
      Name: novatrix-alb-sg-id
