AWSTemplateFormatVersion: '2010-09-09'
Description: Novatrix network infrastructure

Resources:
  # The VPC is our own private network in AWS.
  NovatrixVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: novatrix-vpc

  # Public subnet: can be reached from the internet.
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NovatrixVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: eu-north-1a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: novatrix-public

  # RDS needs a subnet in each of at least two Availability Zones.
  # Private subnet A: not reachable from the internet.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NovatrixVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: eu-north-1a
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: novatrix-private-a

  # Private subnet B: same idea, but in a different zone (b).
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NovatrixVPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: eu-north-1b
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: novatrix-private-b

  # The Internet Gateway is the "door" between our VPC and the internet.
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: novatrix-igw

  # This connects the Internet Gateway to our VPC.
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref NovatrixVPC
      InternetGatewayId: !Ref InternetGateway

  # A route table is a list of rules that say where network traffic goes.
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref NovatrixVPC
      Tags:
        - Key: Name
          Value: novatrix-public-rt

  # Sends all internet traffic (0.0.0.0/0) to the Internet Gateway.
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # Links the route table to the public subnet.
  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # Private route table: local VPC traffic only.
  # It has no route to the internet. AWS adds the local route automatically.
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref NovatrixVPC
      Tags:
        - Key: Name
          Value: novatrix-private-rt

  # Links the private route table to private subnet A.
  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  # Links the private route table to private subnet B.
  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # A security group is a firewall for the web server.
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Novatrix web server
      GroupName: novatrix-web-sg
      VpcId: !Ref NovatrixVPC
      Tags:
        - Key: Name
          Value: novatrix-web-sg

  # Allow web traffic (HTTP) from anywhere.
  WebInboundHTTP:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WebSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0

  # Allow secure web traffic (HTTPS) from anywhere.
  WebInboundHTTPS:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WebSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0

  # Allow SSH only from one IP address (/32 = just this address).
  WebInboundSSH:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WebSecurityGroup
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: 81.226.253.57/32

  # A Network ACL is a firewall for the whole subnet.
  # Anything not allowed by a rule below is blocked.
  PublicNetworkAcl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref NovatrixVPC
      Tags:
        - Key: Name
          Value: novatrix-public-nacl

  # Connects the Network ACL to the public subnet.
  PublicNetworkAclAssociation:
    Type: AWS::EC2::NetworkAclAssociation
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      SubnetId: !Ref PublicSubnet

  # --- Inbound rules ---

  # Allow web traffic (HTTP) from anywhere.
  PublicInboundHTTP:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 80
        To: 80

  # Allow secure web traffic (HTTPS) from anywhere.
  PublicInboundHTTPS:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 110
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 443
        To: 443

  # Allow SSH only from one IP address (/32 = just this address).
  PublicInboundSSH:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 120
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 81.226.253.57/32
      PortRange:
        From: 22
        To: 22

  # Allow replies to connections the server started (ephemeral ports).
  PublicInboundEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 130
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 1024
        To: 65535

  # --- Outbound rules ---

  # Allow the server to call out over HTTP (e.g. updates).
  PublicOutboundHTTP:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 80
        To: 80

  # Allow the server to call out over HTTPS.
  PublicOutboundHTTPS:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 110
      Protocol: 6
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 443
        To: 443

  # Allow replies to users (ephemeral ports).
  PublicOutboundEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 120
      Protocol: 6
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 1024
        To: 65535

  # Allow the web server to reach the MySQL database inside the VPC.
  PublicOutboundMySQL:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 140
      Protocol: 6
      RuleAction: allow
      Egress: true
      CidrBlock: 10.0.0.0/16
      PortRange:
        From: 3306
        To: 3306

  # Allow the web server to reach shared storage (NFS/EFS) inside the VPC.
  PublicOutboundNFS:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 150
      Protocol: 6
      RuleAction: allow
      Egress: true
      CidrBlock: 10.0.0.0/16
      PortRange:
        From: 2049
        To: 2049

# Outputs share values with other stacks (use !ImportValue).
Outputs:
  VPCId:
    Description: ID of the Novatrix VPC
    Value: !Ref NovatrixVPC
    Export:
      Name: novatrix-vpc-id

  PublicSubnetId:
    Description: ID of the public subnet
    Value: !Ref PublicSubnet
    Export:
      Name: novatrix-public-subnet-id

  PrivateSubnetAId:
    Description: ID of private subnet A
    Value: !Ref PrivateSubnetA
    Export:
      Name: novatrix-private-subnet-a-id

  PrivateSubnetBId:
    Description: ID of private subnet B
    Value: !Ref PrivateSubnetB
    Export:
      Name: novatrix-private-subnet-b-id

  WebSecurityGroupId:
    Description: ID of the web server security group
    Value: !Ref WebSecurityGroup
    Export:
      Name: novatrix-web-sg-id
