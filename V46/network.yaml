AWSTemplateFormatVersion: '2010-09-09'
Description: Novatrix network infrastructure

Resources:
  # The VPC is our own private network in AWS.
  NovatrixVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: novatrix-vpc

  # Public subnet: can be reached from the internet.
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NovatrixVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: eu-north-1a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: novatrix-public

  # RDS needs a subnet in each of at least two Availability Zones.
  # Private subnet A: not reachable from the internet.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NovatrixVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: eu-north-1a
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: novatrix-private-a

  # Private subnet B: same idea, but in a different zone (b).
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NovatrixVPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: eu-north-1b
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: novatrix-private-b

  # The Internet Gateway is the "door" between our VPC and the internet.
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: novatrix-igw

  # This connects the Internet Gateway to our VPC.
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref NovatrixVPC
      InternetGatewayId: !Ref InternetGateway

  # A route table is a list of rules that say where network traffic goes.
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref NovatrixVPC
      Tags:
        - Key: Name
          Value: novatrix-public-rt

  # Sends all internet traffic (0.0.0.0/0) to the Internet Gateway.
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # Links the route table to the public subnet.
  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # A security group is a firewall for the web server.
  # It has no rules yet, so inbound traffic is blocked for now.
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Novatrix web server
      GroupName: novatrix-web-sg
      VpcId: !Ref NovatrixVPC
      Tags:
        - Key: Name
          Value: novatrix-web-sg

# Outputs share values with other stacks (use !ImportValue).
Outputs:
  VPCId:
    Description: ID of the Novatrix VPC
    Value: !Ref NovatrixVPC
    Export:
      Name: novatrix-vpc-id

  PublicSubnetId:
    Description: ID of the public subnet
    Value: !Ref PublicSubnet
    Export:
      Name: novatrix-public-subnet-id

  PrivateSubnetAId:
    Description: ID of private subnet A
    Value: !Ref PrivateSubnetA
    Export:
      Name: novatrix-private-subnet-a-id

  PrivateSubnetBId:
    Description: ID of private subnet B
    Value: !Ref PrivateSubnetB
    Export:
      Name: novatrix-private-subnet-b-id
