AWSTemplateFormatVersion: '2010-09-09'
Description: Novatrix database and storage infrastructure

Resources:
  # Tells RDS which subnets the database can use.
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for Novatrix database
      DBSubnetGroupName: novatrix-db-subnets
      # Two private subnets in different zones (RDS needs at least two).
      # The IDs come from the network stack.
      SubnetIds:
        - !ImportValue novatrix-private-subnet-a-id
        - !ImportValue novatrix-private-subnet-b-id
      Tags:
        - Key: Name
          Value: novatrix-db-subnets

  # Firewall for the database.
  # Only the web server can connect, on the MySQL port (3306).
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Novatrix database
      GroupName: novatrix-db-sg
      # The VPC ID comes from the network stack.
      VpcId: !ImportValue novatrix-vpc-id
      # Allow traffic only from the web server's security group.
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !ImportValue novatrix-web-sg-id
      Tags:
        - Key: Name
          Value: novatrix-db-sg

  # Firewall for EFS (shared file storage).
  # Only the web server can connect, on the NFS port (2049).
  EFSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Novatrix EFS
      GroupName: novatrix-efs-sg
      VpcId: !ImportValue novatrix-vpc-id
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !ImportValue novatrix-web-sg-id
      Tags:
        - Key: Name
          Value: novatrix-efs-sg

  # The shared file system (EFS). Many servers can use it at the same time.
  NovatrixEFS:
    Type: AWS::EFS::FileSystem
    Properties:
      # Data is encrypted on disk.
      Encrypted: true
      PerformanceMode: generalPurpose
      # Speed grows with the amount of data stored.
      ThroughputMode: bursting
      FileSystemTags:
        - Key: Name
          Value: novatrix-efs

  # The "door" to EFS in private subnet A.
  EFSMountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref NovatrixEFS
      SubnetId: !ImportValue novatrix-private-subnet-a-id
      SecurityGroups:
        - !Ref EFSSecurityGroup

  # The same, in private subnet B (a different zone).
  EFSMountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref NovatrixEFS
      SubnetId: !ImportValue novatrix-private-subnet-b-id
      SecurityGroups:
        - !Ref EFSSecurityGroup

# Outputs share values with other stacks (use !ImportValue).
Outputs:
  # Lets other stacks use the database security group.
  DatabaseSecurityGroupId:
    Description: ID of the database security group
    Value: !Ref DatabaseSecurityGroup
    Export:
      Name: novatrix-db-sg-id

  # Lets other stacks use the EFS security group.
  EFSSecurityGroupId:
    Description: ID of the EFS security group
    Value: !Ref EFSSecurityGroup
    Export:
      Name: novatrix-efs-sg-id

  # Lets other stacks mount the file system (e.g. the web server).
  EFSFileSystemId:
    Description: ID of the Novatrix EFS file system
    Value: !Ref NovatrixEFS
    Export:
      Name: novatrix-efs-id
