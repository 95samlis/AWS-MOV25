<!DOCTYPE html>
<!-- Demo page for the GitHub specials, published as index.html in the root of aws-startpaket. -->
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novatrix AB</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #f3efe6;
    background: linear-gradient(160deg, #0f1838, #1f2f6b);
  }
  main {
    max-width: 560px;
    margin: 2rem;
    padding: 2.5rem;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.15);
  }
  h1 { margin: 0 0 .5rem; font-size: 2.6rem; }
  h1 span { color: #ffb547; }
  ul { padding-left: 1.2rem; line-height: 1.8; }
</style>

<body>
<main>
  <h1>Novatrix <span>AB</span></h1>
  <p>Välkommen till Novatrix. Vi hjälper företag att flytta sin webbplats och sina system till molnet, tryggt och till rimlig kostnad.</p>
  <ul>
    <li>Molnmigrering till AWS</li>
    <li>Drift och övervakning</li>
    <li>Webbplatser som klarar växande trafik</li>
  </ul>
</main>
</body>
</html>
